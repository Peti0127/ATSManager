<header><h1>E-Mail Einstellungen</h1><p>Weiterleitungen und Abwesenheitsnotizen zentral verwalten.</p></header><form id="form" novalidate>
<section class="card"><div class="heading"><h2>Automatische Weiterleitung</h2><p>Eingehende Nachrichten an eine interne Adresse weiterleiten.</p></div><label class="switch-row"><span><strong>Weiterleitung aktivieren</strong><small>Nur Adressen Ihrer Organisation sind erlaubt.</small></span><span class="switch"><input id="forward-on" type="checkbox" role="switch"><span class="track"></span></span></label><div id="forward-fields" class="conditional" hidden><label for="forward-address">Weiterleiten an</label><input id="forward-address" type="email" placeholder="E-Mail-Adresse eingeben"><div class="meta"><span>Erlaubte Domain: <b id="domain">…</b></span><span id="forward-error" class="error"></span></div></div></section>
<section class="card"><div class="heading"><h2>Automatische Antworten</h2><p>Personen informieren, wenn Sie nicht erreichbar sind.</p></div><label class="switch-row"><span><strong>Automatische Antworten aktivieren</strong><small>Antworten werden einmal pro Absender gesendet.</small></span><span class="switch"><input id="reply-on" type="checkbox" role="switch"><span class="track"></span></span></label><div id="reply-fields" class="conditional stack" hidden>
<label class="switch-row nested"><span><strong>Für eine Zeitperiode einschalten</strong><small>Start und Ende automatisch steuern.</small></span><span class="switch"><input id="period-on" type="checkbox" role="switch"><span class="track"></span></span></label><div id="dates" class="dates" hidden><div><label for="start">Start</label><input id="start" type="datetime-local"></div><div><label for="end">Ende</label><input id="end" type="datetime-local"></div><p id="date-error" class="error wide"></p></div>
<div class="editor-field"><label>Antwort innerhalb der Organisation</label><div class="editor-shell"><div class="toolbar"><button type="button" data-cmd="bold"><b>B</b></button><button type="button" data-cmd="italic"><i>I</i></button><button type="button" data-cmd="insertUnorderedList">• Liste</button><button type="button" data-cmd="createLink">Link</button></div><div id="internal" class="editor" contenteditable="true" role="textbox" data-placeholder="Automatische Antwort eingeben …"></div></div><p id="internal-error" class="error"></p></div>
<label class="switch-row nested"><span><strong>Separate Nachricht für externe Personen</strong><small>Eigene Antwort außerhalb Ihrer Organisation senden.</small></span><span class="switch"><input id="external-on" type="checkbox" role="switch"><span class="track"></span></span></label><div id="external-fields" class="editor-field" hidden><label>Antwort außerhalb der Organisation</label><div class="editor-shell"><div class="toolbar"><button type="button" data-cmd="bold"><b>B</b></button><button type="button" data-cmd="italic"><i>I</i></button><button type="button" data-cmd="insertUnorderedList">• Liste</button><button type="button" data-cmd="createLink">Link</button></div><div id="external" class="editor" contenteditable="true" role="textbox" data-placeholder="Antwort für externe Personen eingeben …"></div></div><p id="external-error" class="error"></p></div></div></section>
<div id="status" class="status" role="status"></div><div class="actions"><button id="save" class="primary">Änderungen speichern</button></div></form></main>
